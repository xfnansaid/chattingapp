<!DOCTYPE html>
<html>
<head><title>Chat</title></head>
<body>
    <h2>Welcome, {{ current_user }}</h2>
    <div id="chat-box" style="height: 300px; border: 1px solid #ccc; overflow-y: scroll; margin-bottom: 10px; padding: 10px;"></div>
    
    <input type="text" id="message-input" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>

    <script>
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('message-input');

        async function fetchMessages() {
            try {
                // The '?t=' adds a timestamp to the URL. This is a "Cache Buster" that 
                // forces Vercel and your browser to fetch fresh data every single time.
                const response = await fetch('/messages?t=' + new Date().getTime());
                
                // If the server crashes (e.g., a 500 error from a database typo), 
                // this catches it and prints it to the screen instead of crashing the page.
                if (!response.ok) {
                    const errorText = await response.text();
                    chatBox.innerHTML = `<div style="color: red; padding: 10px;">Server Error ${response.status}: Check your Vercel logs to see what crashed.</div>`;
                    console.error("Server Error:", errorText);
                    return;
                }

                const messages = await response.json();
                
                if (messages.error) {
                    chatBox.innerHTML = `<div style="color: orange; padding: 10px;">Session Error: ${messages.error}</div>`;
                    return; 
                }

                // Render the messages
                chatBox.innerHTML = '';
                if (messages.length === 0) {
                    chatBox.innerHTML = '<div style="color: gray; font-style: italic;">No messages yet.</div>';
                } else {
                    messages.forEach(msg => {
                        chatBox.innerHTML += `<div><strong>${msg.sender}:</strong> ${msg.text}</div>`;
                    });
                }
                
                // Auto-scroll to the bottom
                chatBox.scrollTop = chatBox.scrollHeight;
                
            } catch (err) {
                // Catches network disconnects or Javascript breaking
                chatBox.innerHTML = `<div style="color: red; padding: 10px;">Javascript Error: ${err.message}</div>`;
            }
        }

        async function sendMessage() {
            const text = input.value;
            if (!text) return;
            
            input.value = ''; // Clear the input box instantly for a better feel
            
            await fetch('/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            
            fetchMessages(); // Pull the new message down immediately
        }

        // Poll for new messages every 2 seconds
        setInterval(fetchMessages, 2000);
        fetchMessages(); // Load initially
    </script>
</body>
</html>
